name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be asked for without pushing something to ask for it.
  workflow_dispatch:

# This package is interfaces and nothing else. There is no behaviour to run, so there are no
# tests to run either — saying so beats a job which fails the same way every time.
jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
